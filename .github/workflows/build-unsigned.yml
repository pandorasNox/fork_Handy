name: Build Unsigned

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build (windows, macos, linux)"
        required: true
        default: "windows,macos,linux"
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Skip if platform not selected
        if: ${{ !contains(inputs.platform, matrix.platform) }}
        run: echo "Skipping ${{ matrix.platform }} build" && exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App (unsigned)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          args: "--no-bundle-sign"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-unsigned
          path: |
            src-tauri/target/release/bundle/
